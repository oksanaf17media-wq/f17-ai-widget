<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F17 Media - AI Strategy Assistant</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f1117;
            color: #f3f4f6;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .chat-container {
            width: 100%;
            max-width: 480px;
            height: 90vh;
            background: #181b22;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid #2d333b;
        }
        .chat-header {
            background: #21262d;
            padding: 16px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid #30363d;
        }
        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #f0f6fc;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            margin-right: 12px;
            border: 2px solid #58a6ff;
        }
        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .header-info h2 {
            margin: 0;
            font-size: 16px;
            color: #f0f6fc;
        }
        .header-info p {
            margin: 2px 0 0 0;
            font-size: 12px;
            color: #8b949e;
        }
        .chat-messages {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.5;
            word-wrap: break-word;
        }
        .message.user {
            background: #238636;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }
        .message.assistant {
            background: #21262d;
            color: #c9d1d9;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            border: 1px solid #30363d;
        }
        .typing-indicator {
            display: none;
            align-self: flex-start;
            background: #21262d;
            padding: 10px 14px;
            border-radius: 12px;
            border: 1px solid #30363d;
            color: #8b949e;
            font-size: 13px;
            font-style: italic;
        }
        .chat-input-area {
            padding: 16px;
            background: #21262d;
            border-top: 1px solid #30363d;
            display: flex;
            gap: 8px;
        }
        .chat-input-area input {
            flex: 1;
            background: #0f1117;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 10px 14px;
            color: white;
            font-size: 14px;
            outline: none;
        }
        .chat-input-area input:focus {
            border-color: #58a6ff;
        }
        .chat-input-area button {
            background: #238636;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 0 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        .chat-input-area button:hover {
            background: #2ea043;
        }
        .whatsapp-btn {
            display: inline-block;
            margin-top: 8px;
            background: #25d366;
            color: white;
            padding: 8px 14px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            font-size: 13px;
        }
        .whatsapp-btn:hover {
            background: #20ba5a;
        }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">
        <div class="avatar">
            <!-- Красивая премиальная иконка или фото для ассистента -->
            <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&h=100&fit=crop&crop=faces" alt="Oksana's AI Assistant">
        </div>
        <div class="header-info">
            <h2>Oksana's AI Assistant</h2>
            <p>F17 Media Strategy Expert</p>
        </div>
    </div>

    <div class="chat-messages" id="chatMessages">
        <div class="message assistant">
            Hello! I'm Oksana's AI strategy assistant at F17 Media. What is your business niche, and what are your main goals for social media right now?
        </div>
    </div>

    <div class="typing-indicator" id="typingIndicator">
        Oksana's AI is thinking...
    </div>

    <div class="chat-input-area">
        <input type="text" id="userInput" placeholder="Type your message..." autofocus>
        <button onclick="sendMessage()">Send</button>
    </div>
</div>

<script>
    const messagesContainer = document.getElementById('chatMessages');
    const userInput = document.getElementById('userInput');
    const typingIndicator = document.getElementById('typingIndicator');

    let chatHistory = [
        { role: "assistant", parts: [{ text: "Hello! I'm Oksana's AI strategy assistant at F17 Media. What is your business niche, and what are your main goals for social media right now?" }] }
    ];

    userInput.addEventListener('keypress', function (e) {
        if (e.key === 'Enter') {
            sendMessage();
        }
    });

    async function sendMessage() {
        const text = userInput.value.trim();
        if (!text) return;

        appendMessage('user', text);
        chatHistory.push({ role: "user", parts: [{ text: text }] });
        userInput.value = '';

        typingIndicator.style.display = 'block';
        messagesContainer.scrollTop = messagesContainer.scrollHeight;

        try {
            const response = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ history: chatHistory })
            });

            const data = await response.json();
            typingIndicator.style.display = 'none';

            if (data.reply) {
                let replyText = data.reply;
                
                // Автоматически превращаем упоминание WhatsApp в красивую кнопку со ссылкой
                if (replyText.toLowerCase().includes('whatsapp')) {
                    replyText = replyText.replace(/whatsapp/gi, '<br><br><a href="https://wa.me/YOUR_PHONE_NUMBER" target="_blank" class="whatsapp-btn">💬 Continue in WhatsApp</a>');
                }

                appendMessage('assistant', replyText, true);
                chatHistory.push({ role: "assistant", parts: [{ text: data.reply }] });
            } else if (data.error) {
                appendMessage('assistant', 'Sorry, an error occurred. Please try again.');
            }
        } catch (err) {
            typingIndicator.style.display = 'none';
            appendMessage('assistant', 'Connection error. Please check your network.');
        }
    }

    function appendMessage(role, text, isHtml = false) {
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${role}`;
        
        if (isHtml) {
            // Рендерим Markdown если нужно или оставляем HTML для кнопки
            msgDiv.innerHTML = marked.parse(text);
            // На всякий случай обрабатываем ссылки в тексте ответа
            msgDiv.querySelectorAll('a').forEach(a => {
                if(!a.classList.contains('whatsapp-btn')) {
                    a.target = '_blank';
                }
            });
        } else {
            msgDiv.textContent = text;
        }

        messagesContainer.appendChild(msgDiv);
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }
</script>

</body>
</html>
